# Python package

# Create and test a Python package on multiple Python versions.
# Add steps that analyze code, save the dist with the build record, publish to a PyPI-compatible index, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/python

trigger:
- combo_d

pool:
  vmImage: ubuntu-latest
strategy:
  matrix:
    Python39:
      python.version: '3.9'

steps:
- script: |
    python -m pip install pip==24.0
    pip install -r requirements.txt
  displayName: 'Install dependencies'

- script: |
    echo "Current working directory: $(pwd)"
    echo "Listing top-level directories:"
    find . -maxdepth 1 -type d
  displayName: 'Show Working Directory Contents'

#- script: |
#    pylint --errors-only --ignore=.venv --output-format=json . | jq '.[] | select(.type == "error") | .path'
#  displayName: 'PyLint'


- script: |
    pip install pytest pytest-azurepipelines coverage
    coverage run -m pytest ./Test
  displayName: 'Test'

- task: Docker@2
  inputs:
    containerRegistry: 'Docker'
    repository: 'hacky1610/emmanuel_ti'
    command: 'buildAndPush'
    Dockerfile: '**/Dockerfile'
    tags: 'v112.27'
